[theme]
base = "dark"
primaryColor = "#00F5D4"
backgroundColor = "#0B0F19"
secondaryBackgroundColor = "#111827"
textColor = "#E2E8F0"
borderColor = "#1E293B"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "8px"

font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Space Grotesk':https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"

baseFontSize = 15
linkUnderline = false

redColor = "#FF2E63"
greenColor = "#00F5D4"
blueColor = "#3B82F6"
orangeColor = "#FFB703"
violetColor = "#8B5CF6"

chartCategoricalColors = ["#00F5D4", "#FF2E63", "#FFB703", "#3B82F6", "#8B5CF6", "#10B981"]

[theme.sidebar]
backgroundColor = "#060911"
secondaryBackgroundColor = "#0D1322"
textColor = "#E2E8F0"
borderColor = "#1E293B"
primaryColor = "#00F5D4"
